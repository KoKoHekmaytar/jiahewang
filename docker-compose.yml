# this file uses prebuilt image in dockerhub
services:
  jekyll:
    image: amirpourmand/al-folio:v0.16.3
    build: .
    # uncomment these if you are having this issue with the build:
    # /usr/local/bundle/gems/jekyll-4.3.4/lib/jekyll/site.rb:509:in `initialize': Permission denied @ rb_sysopen - /srv/jekyll/.jekyll-cache/.gitignore (Errno::EACCES)
    # and fill the args values with the output of the commands on the right
    # build:
    #   args:
    #     GROUPID: # id -g
    #     GROUPNAME: # id -gn
    #     USERID: # id -u
    #     USERNAME: # echo $USER
    # Host 4000 → container 8080 (Jekyll). Use 4000 on Windows if 8080 fails with "forbidden by access permissions".
    ports:
      - 4000:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
    # Use the repo’s script (not the image copy) so local entry_point / _config_dev changes apply without rebuild.
    command: ["/bin/bash", "/srv/jekyll/bin/entry_point.sh"]
    environment:
      - JEKYLL_ENV=development
